<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<meta name="description" content="Controle de estoque 2Wheels: lançamentos por unidade ou caixa, saldo por produto e mensagem pronta para o grupo de controle no WhatsApp.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121218'/%3E%3Ctext x='32' y='44' font-family='Arial Narrow,Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%238FC332'%3E2W%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:dark light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Estoque 2Wheels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#121218;--sf:#1B1B24;--sf2:#24242F;--sf3:#2D2D3A;--bd:#33333F;--bd2:#44445280;
  --tx:#F1F1F4;--mu:#A6A6B5;--dim:#73738A;
  --g:#8FC332;--gt:#A6D64E;--gbg:#8FC33222;--gink:#1A2A05;
  --p:#5B2A86;--pt:#C3A2EC;--pbg:#5B2A8640;--pfill:#6E3AA0;
  --am:#F2B84B;--ambg:#F2B84B22;--rd:#FF6B6B;--rdbg:#FF6B6B22;
  --ring:#A6D64E;--sh:0 8px 30px #00000066;--phink:#5B2A86;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--fb:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F3F7;--sf:#FFFFFF;--sf2:#EEEDF3;--sf3:#E4E2EC;--bd:#D9D7E2;--bd2:#C9C7D480;
  --tx:#16151C;--mu:#5F5E6E;--dim:#7C7B8C;
  --g:#5F8A14;--gt:#46620F;--gbg:#8FC33230;--gink:#FFFFFF;
  --p:#5B2A86;--pt:#4A2070;--pbg:#5B2A8618;--pfill:#5B2A86;
  --am:#9A6508;--ambg:#F2B84B33;--rd:#C62828;--rdbg:#FF6B6B26;
  --ring:#5B2A86;--sh:0 8px 30px #2B234A22;--phink:#5B2A86;
}}
:root[data-theme="light"]{
  --bg:#F4F3F7;--sf:#FFFFFF;--sf2:#EEEDF3;--sf3:#E4E2EC;--bd:#D9D7E2;--bd2:#C9C7D480;
  --tx:#16151C;--mu:#5F5E6E;--dim:#7C7B8C;
  --g:#5F8A14;--gt:#46620F;--gbg:#8FC33230;--gink:#FFFFFF;
  --p:#5B2A86;--pt:#4A2070;--pbg:#5B2A8618;--pfill:#5B2A86;
  --am:#9A6508;--ambg:#F2B84B33;--rd:#C62828;--rdbg:#FF6B6B26;
  --ring:#5B2A86;--sh:0 8px 30px #2B234A22;--phink:#5B2A86;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 var(--fb);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font:700 22px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand b{color:var(--g)}
.brand small{font:600 12px/1 var(--fd);letter-spacing:.14em;color:var(--mu)}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;flex:0 0 auto}
.st.ok i{background:var(--g)}.st.local i{background:var(--am)}.st.err i{background:var(--rd)}
.gear{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--mu);background:var(--sf2);flex:0 0 auto}
.gear:hover{color:var(--tx)}
.tabs{position:sticky;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;color:var(--mu);font:600 15px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;min-height:56px;justify-content:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--gt);background:var(--gbg)}
main{flex:1;padding:14px 14px 24px;display:flex;flex-direction:column;gap:14px}
h2{font:700 24px/1.1 var(--fd);margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font:600 13px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu)}.dim{color:var(--dim)}.sm{font-size:13px}.xs{font-size:12px}
.hint{font-size:13px;color:var(--mu);line-height:1.4}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--sf2);padding:5px;border-radius:14px}
.seg button{min-height:56px;border-radius:10px;font:700 20px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on-S{background:var(--pfill);color:#fff}
.seg button.on-E{background:var(--g);color:var(--gink)}
.seg button.on-AJ{background:var(--sf3);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font:600 15px/1 var(--fd);letter-spacing:.04em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--gbg);border-color:var(--g);color:var(--gt)}
.chip.on.p{background:var(--pbg);border-color:var(--pfill);color:var(--pt)}
.chip.sm{min-height:40px;padding:0 12px;font-size:14px}
.search{position:relative}
.search input{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);padding:0 48px 0 44px;font-size:17px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu);pointer-events:none}
.search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;color:var(--mu);display:grid;place-items:center}
.list{display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--sf)}
.list:empty{display:none}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--bd);min-height:56px;text-align:left;width:100%;background:none;color:inherit}
.it:first-child{border-top:0}
.it:hover{background:var(--sf2)}
.th{width:40px;height:40px;border-radius:8px;background:#fff;object-fit:contain;flex:0 0 auto;border:1px solid var(--bd)}
.th.ph{display:grid;place-items:center;color:var(--phink);font:700 14px var(--fd);background:#fff}
.th.lg{width:56px;height:56px}
.nm{font-weight:600;font-size:15px;line-height:1.2}
.vr{font-size:13px;color:var(--mu)}
.sd{font:700 22px/1 var(--fd);min-width:44px;text-align:right}
.sd small{display:block;font:600 11px/1 var(--fd);letter-spacing:.1em;color:var(--dim);margin-top:3px}
.sd.q{color:var(--dim);font-weight:600}.sd.z{color:var(--rd)}.sd.lo{color:var(--am)}
.badge{display:inline-block;font:600 11px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--sf3);color:var(--mu);vertical-align:middle;margin-left:6px}
.badge.kit{background:var(--pbg);color:var(--pt)}
.badge.warn{background:var(--ambg);color:var(--am)}
.badge.off{background:var(--sf3);color:var(--dim)}
.grp{padding:8px 10px 4px;font:600 12px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);background:var(--sf2);border-top:1px solid var(--bd)}
.grp:first-child{border-top:0}
/* cart */
.cl{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;border-top:1px solid var(--bd);min-height:64px}
.cl:first-child{border-top:0}
.cl .body{flex:1;min-width:0;text-align:left;background:none;color:inherit;display:flex;align-items:center;gap:10px;padding:4px 0}
.cl .body:hover .nm{color:var(--gt)}
.cl .qs{font:700 17px/1.2 var(--fd);margin-top:2px}
.cl .qs .neg{color:var(--rd)}
.cl .sub{font-size:12px;color:var(--mu);margin-top:2px}
.rm{width:44px;height:44px;border-radius:10px;color:var(--dim);display:grid;place-items:center;flex:0 0 auto}
.rm:hover{color:var(--rd);background:var(--rdbg)}
/* quantity sheet */
.qty{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:1fr;gap:6px;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:10px}
.qrow .lab{font:600 12px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.qrow .lab span:last-child{font-weight:500;letter-spacing:0;text-transform:none;color:var(--dim)}
.stp{display:flex;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.stp button{width:56px;min-height:56px;font:700 28px/1 var(--fd);color:var(--tx);display:grid;place-items:center;flex:0 0 auto}
.stp button:hover{background:var(--sf3)}
.stp input{flex:1;min-width:0;text-align:center;border:0;background:transparent;font:700 26px/1 var(--fd);min-height:56px;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.stp input::placeholder{color:var(--dim);font-weight:500}
.qrow .per{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu)}
.qrow .per input{width:88px;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);text-align:center;font:700 18px var(--fd)}
.qrow .per input::placeholder{color:var(--dim);font-weight:500;font-size:14px}
.qres{font-size:15px;line-height:1.5;padding:4px 2px}
.qres b{font:700 18px var(--fd)}
.qres .neg{color:var(--rd)}
.textin{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);padding:0 14px;font-size:16px}
.textin::placeholder{color:var(--dim)}
.btn{min-height:52px;border-radius:12px;padding:0 18px;font:700 19px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx)}
.btn:hover{background:var(--sf3)}
.btn.g{background:var(--g);color:var(--gink);border-color:transparent}
.btn.g:hover{filter:brightness(1.08)}
.btn.p{background:var(--pfill);color:#fff;border-color:transparent}
.btn.p:hover{filter:brightness(1.1)}
.btn.w{width:100%}
.btn.lg{min-height:64px;font-size:22px}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px;border-radius:10px}
.btn.dg{color:var(--rd)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.footbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 0 6px}
.scrim{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--sf);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h2{flex:1;font-size:21px}
.xbtn{width:44px;height:44px;border-radius:10px;background:var(--sf2);color:var(--mu);display:grid;place-items:center;flex:0 0 auto}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modes button{min-height:48px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);font:600 15px/1.1 var(--fd);letter-spacing:.04em;padding:6px 8px;color:var(--mu);text-align:center}
.modes button.on{background:var(--gbg);border-color:var(--g);color:var(--gt)}
pre.msg{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.45 var(--fb);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:38vh;overflow:auto}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts.two{grid-template-columns:1fr 1fr}
@media (max-width:400px){.acts{grid-template-columns:1fr 1fr}.acts .btn:first-child{grid-column:1/-1}}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center}
.sum b{display:block;font:700 24px/1 var(--fd)}
.sum span{font:600 11px/1.2 var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:block;margin-top:4px}
.sum .am b{color:var(--am)}.sum .rd b{color:var(--rd)}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--bd);min-height:56px;width:100%;text-align:left;background:none;color:inherit}
.srow:hover{background:var(--sf2)}
.srow .sd small{color:var(--mu);letter-spacing:.04em;text-transform:none;font-size:12px}
.hrow{display:flex;flex-direction:column;gap:4px;padding:10px;border-top:1px solid var(--bd);width:100%;text-align:left;background:none;color:inherit}
.hrow:first-child{border-top:0}
.hrow:hover{background:var(--sf2)}
.hrow .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hrow .seq{font:700 16px var(--fd);color:var(--pt)}
.hrow .typ{font:700 14px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px}
.typ.S{background:var(--pbg);color:var(--pt)}.typ.E{background:var(--gbg);color:var(--gt)}.typ.AJ,.typ.INV{background:var(--sf3);color:var(--tx)}.typ.EST{background:var(--ambg);color:var(--am)}
.hrow.est .l1 .seq,.hrow.est .l2{text-decoration:line-through;opacity:.6}
.hrow .l2{font-size:13px;color:var(--mu)}
.hrow .tot{margin-left:auto;font:700 18px var(--fd)}
.crow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--bd)}
.crow:first-child{border-top:0}
.crow input{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);text-align:center;font:700 20px/1 var(--fd);-moz-appearance:textfield}
.crow input::-webkit-outer-spin-button,.crow input::-webkit-inner-spin-button{-webkit-appearance:none}
.crow input.done{border-color:var(--g);background:var(--gbg)}
.crow .lab{font:600 10px/1 var(--fd);letter-spacing:.1em;color:var(--dim);text-align:center;margin-bottom:3px;text-transform:uppercase}
.crow .sys{font-size:13px;color:var(--mu)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;border:1px solid}
.banner.am{background:var(--ambg);border-color:var(--am);color:var(--tx)}
.banner.rd{background:var(--rdbg);border-color:var(--rd)}
.banner.g{background:var(--gbg);border-color:var(--g)}
.banner a,.banner button{color:var(--gt);font-weight:600;text-decoration:underline}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;max-width:calc(100% - 28px)}
.toast button{color:var(--g);font:700 15px var(--fd);letter-spacing:.06em;text-transform:uppercase}
.empty{padding:28px 14px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:15px}
.kv .v{font:700 18px var(--fd)}
.sw{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;text-align:left;background:none;color:inherit;padding:0 4px}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--sf3);position:relative;flex:0 0 auto;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:transform .15s}
.sw.on i{background:var(--g)}.sw.on i::after{transform:translateX(18px);background:var(--gink)}
.detail{display:flex;flex-direction:column;gap:6px}
.detail .li{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:6px 0;border-top:1px solid var(--bd)}
.detail .li:first-child{border-top:0}
.kitc{display:flex;flex-direction:column;gap:6px}
.kitc .li{display:grid;grid-template-columns:1fr 84px 44px;gap:8px;align-items:center}
.kitc input{min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);text-align:center;font:700 18px var(--fd);width:100%}
label.fl{font-size:13px;color:var(--mu);display:block;margin-bottom:-6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:721px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
</style>
<div id="app" aria-label="Estoque 2Wheels">
  <header class="top">
    <div class="brand"><span>2<b>W</b></span><small>Estoque</small></div>
    <div class="st" id="st"><i></i><span>conectando…</span></div>
    <button class="gear" id="btn-cfg" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Seções">
    <button class="tab on" data-tab="lancar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Lançar</button>

/* ---------- HISTÓRICO ---------- */

function openMov(id) {

}
async function estornar(x, motivoExtra) {

}

  <div class="footbar"><div class="acts"><button class="btn lg g" id="c-save" ${feitos ? '' : 'disabled'}>Salvar contagem · ${feitos}</button><button class="btn" id="c-zero">Zerar não contados</button><button class="btn" id="c-clear">Limpar</button></div></div>`;
  const refresh = () => { const f = rows.filter(contado).length; const btn = m.querySelector('#c-save'); if (btn) { btn.disabled = !f; btn.textContent = `Salvar contagem · ${f}`; } const p = m.querySelector('#c-prog'); if (p) p.textContent = `${f}/${rows.length} contados`; };
  const bindNum = (sel, keyOf) => m.querySelectorAll(sel).forEach(i => { i.onchange = () => { contSet({ [keyOf(i)]: i.value === '' ? null : Math.max(0, num(i.value)) }); i.classList.toggle('done', i.value !== ''); refresh(); }; i.onfocus = () => i.select(); i.onkeydown = e => { if (e.key === 'Enter') { const all = [...m.querySelectorAll('.crow input')]; const n = all[all.indexOf(i) + 1]; if (n) n.focus(); else i.blur(); } }; });
  bindNum('[data-cun]', i => i.dataset.cun); bindNum('[data-ccx]', i => 'cx:' + i.dataset.ccx);

  m.querySelector('#c-clear').onclick = () => { if (!confirm('Limpar os campos desta linha?')) return; const p = {}; for (const s of rows) { p[s.k] = null; p['cx:' + s.k] = null; } contSet(p); render(); };

/* ---------- AJUSTES ---------- */
function openCfg() {
  const nDocs = Object.keys(S.movs).length + Object.keys(S.arqs).length + 4;
  sheet(`<div class="hd"><h2>Ajustes</h2><button class="xbtn" data-close aria-label="Fechar">✕</button></div>
  <div class="kv"><span>Quem lança</span><span class="v">${esc(S.autor || '—')}</span><span>Conexão</span><span>${S.mode === 'db' ? 'banco compartilhado (sincronizado)' : S.mode === 'local' ? 'só neste aparelho' : esc(S.mode)}</span><span>Lançamentos vivos</span><span class="num">${fmt(Object.keys(S.movs).length)} (limite do banco ≈ 4.900 documentos; hoje ${fmt(nDocs)})</span><span>Último nº</span><span class="num">#${pad(S.seqMax)}</span><span>Catálogo</span><span>${CAT.skus.length} SKUs · ${CAT.kits.length} kits · versão ${esc(CAT.versao)}</span></div>

  <div class="hint">Quando o histórico crescer, <b>Fechar período</b> compacta os lançamentos anteriores a uma data num único registro de arquivo (com os saldos daquele momento). O histórico continua visível; só deixa de ocupar um documento por lançamento.</div>
  <div class="row"><input class="textin grow" id="c-data" type="date" aria-label="Fechar até a data"><button class="btn" id="c-fechar">Fechar período</button></div>
  <div class="hint xs">Catálogo: loja Tray (web_api), tabela B2B 2026 e cadastro GS1 de códigos de barras. "Caixa cheia" é a caixa padrão de estoque; as unidades por caixa cheia são definidas por vocês tocando no produto na aba Estoque.</div>`);
  const sh = $('#sheet');

  sh.querySelector('#c-kits').onclick = () => openKits();

function openKits() {
  sheet(`<div class="hd"><h2>Kits</h2><button class="xbtn" data-close aria-label="Fechar">✕</button></div><div class="hint">Toque num kit para conferir ou corrigir a composição. Kits com a etiqueta “a confirmar” não podem ser lançados até você salvar a composição.</div>
  <div class="list">${CAT.kits.map(k => { const c = kitComp(k.k); return `<button class="it" data-k="${esc(k.k)}">${thumb(k.k)}<div class="grow"><div class="nm">${esc(k.n)}${c.ok ? '' : '<span class="badge warn">a confirmar</span>'}${k.ind ? '<span class="badge off">sem estoque na loja</span>' : ''}</div><div class="vr">${c.itens.map(x => `${x.q}× ${esc(nomeSku(x.k))}`).join(' · ') || 'sem composição'}</div></div></button>`; }).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => openKitEdit(b.dataset.k));
}
function csvEscape(v) { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvMovs() { const rows = [['seq', 'data', 'hora', 'tipo', 'motivo', 'canal', 'autor', 'obs', 'sku', 'produto', 'delta_un', 'delta_cx_cheias', 'unidades', 'caixas', 'un_por_caixa', 'kit', 'estornado']]; for (const x of todosMovs()) for (const it of (x.itens || []).filter(Boolean)) rows.push([x.seq, new Date(x.ts).toLocaleDateString('pt-BR'), new Date(x.ts).toLocaleTimeString('pt-BR').slice(0, 5), DIRN[x.dir] || x.dir, x.motivo, x.canal, x.autor, x.obs, it.k, nomeSku(it.k), it.d == null ? '' : it.d, it.dc == null ? '' : it.dc, it.un, it.cx, it.cxUn, it.kit ? (KIT[it.kit] || {}).n : '', x.estornadoPor ? 'sim' : '']); return rows.map(r => r.map(csvEscape).join(';')).join('\n'); }
function csvSaldos() { const rows = [['sku', 'linha', 'familia', 'produto', 'variacao', 'saldo_un', 'saldo_cx_cheias', 'un_por_caixa_cheia', 'minimo', 'ean', 'codigo_b2b', 'tray_id']]; for (const s of CAT.skus) rows.push([s.k, LINHA[s.l], FAMI[s.f].n, s.n, s.v, S.saldos[s.k] == null ? '' : S.saldos[s.k], S.saldosCx[s.k] == null ? '' : S.saldosCx[s.k], cxPadrao(s.k) || '', minDe(s.k) == null ? '' : minDe(s.k), s.e || '', s.b || '', s.t || '']); return rows.map(r => r.map(csvEscape).join(';')).join('\n'); }
function openCsv() {
  sheet(`<div class="hd"><h2>Exportar</h2><button class="xbtn" data-close aria-label="Fechar">✕</button></div><div class="hint">Copie e cole numa planilha (separador ponto-e-vírgula) ou compartilhe.</div>
  <div class="acts"><button class="btn" id="x-m">Copiar lançamentos</button><button class="btn" id="x-s">Copiar saldos</button><button class="btn" id="x-sh" ${navigator.share ? '' : 'disabled'}>Compartilhar</button></div>`);
  const sh = $('#sheet'); sh.querySelector('#x-m').onclick = async () => toast((await copiar(csvMovs())) ? 'Lançamentos copiados' : 'Não deu para copiar'); sh.querySelector('#x-s').onclick = async () => toast((await copiar(csvSaldos())) ? 'Saldos copiados' : 'Não deu para copiar'); sh.querySelector('#x-sh').onclick = () => compartilhar(csvSaldos() + '\n\n' + csvMovs());
}
async function fecharPeriodo(dataStr) {
  if (!dataStr) { toast('Escolha a data.'); return; }
  const ate = new Date(dataStr + 'T23:59:59').getTime(); if (!Number.isFinite(ate)) { toast('Data inválida.'); return; }
  const base = baseArq(); if (base && ate <= base.ate) { toast('Já existe um fechamento até ' + new Date(base.ate).toLocaleDateString('pt-BR') + '. Escolha uma data posterior.'); return; }
  const movs = ordenar(Object.values(S.movs).filter(m => m && (!base || m.ts > base.ate) && m.ts <= ate));
  if (!movs.length) { toast('Nenhum lançamento até essa data.'); return; }
  if (!confirm(`Compactar ${movs.length} lançamento(s) até ${new Date(ate).toLocaleDateString('pt-BR')}? Eles continuam no histórico, dentro de um registro de arquivo.`)) return;
  const saldos = {}, saldosCx = {}; if (base) { Object.assign(saldos, base.saldos || {}); Object.assign(saldosCx, base.saldosCx || {}); }
  let seqAte = base ? base.seqAte || 0 : 0; for (const m of movs) { if (m.seq > seqAte) seqAte = m.seq; aplicar(saldos, saldosCx, m); }
  const arq = { id: 'a' + ate.toString(36), ate, seqAte, saldos, saldosCx, movs: movs.map(m => ({ ...m })), criadoEm: new Date().toISOString(), por: S.autor || '' };
  const json = JSON.stringify(arq); if (json.length > 200000) { toast('Período grande demais para um único arquivo. Escolha uma data mais próxima.'); return; }
  try {
    if (S.mode === 'db') { await withRetry(() => S.db.doc('arq/' + arq.id).set(arq)); for (const m of movs) await withRetry(() => S.db.doc('mov/' + m.id).delete()); }
    S.arqs[arq.id] = arq; for (const m of movs) delete S.movs[m.id]; if (S.mode !== 'db') saveLocal(); recompute(); closeSheet(); render(); toast(`${movs.length} lançamentos arquivados`);
  } catch (e) { toast('Falhou: ' + erroTxt(e)); }
}
function openAutor(cb) {
  sheet(`<div class="hd"><h2>Quem está lançando?</h2><button class="xbtn" data-close aria-label="Fechar">✕</button></div><div class="hint">Vai no cabeçalho de cada mensagem. Fica guardado neste aparelho.</div><input class="textin" id="a-n" placeholder="Seu nome" value="${esc(S.autor)}" maxlength="30" autocomplete="name"><button class="btn g w" id="a-ok">Salvar</button>`);
  const sh = $('#sheet'); const ok = () => { const v = sh.querySelector('#a-n').value.trim(); if (!v) return; S.autor = v; lsSet('autor', v); closeSheet(); renderStatus(); render(); cb && cb(); };
  sh.querySelector('#a-ok').onclick = ok; sh.querySelector('#a-n').onkeydown = e => { if (e.key === 'Enter') ok(); }; setTimeout(() => sh.querySelector('#a-n').focus(), 50);

/* ---------- SHEET infra ---------- */
let lastFocus = null;
function sheet(html) { const o = $('#overlay'); if (!o.querySelector('#sheet')) lastFocus = document.activeElement; o.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true">${html}</div></div>`; o.querySelector('#scrim').onclick = e => { if (e.target.id === 'scrim') closeSheet(); }; o.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#overlay').innerHTML = ''; document.body.style.overflow = ''; if (lastFocus && lastFocus.focus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) { } } lastFocus = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet')) closeSheet(); });
/* ===================== BOOT ===================== */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab !== 'historico') S.histQ = ''; closeSheet(); render(); window.scrollTo(0, 0); });
